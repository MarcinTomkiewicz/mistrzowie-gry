<div class="mg-theme-switch flex-row-start-center">
  <span class="tag-badge tag-badge--muted">
    <i class="pi pi-moon-bats" aria-hidden="true"></i>
  </span>

  <p-toggleswitch
    [formControl]="themeControl"
    [ariaLabel]="accessibility().toggleTheme"
    (onChange)="onThemeChange($event.checked)"
  ></p-toggleswitch>

  <span class="tag-badge tag-badge--golden">
    <i class="pi pi-sun-eclipse" aria-hidden="true"></i>
  </span>
</div>
