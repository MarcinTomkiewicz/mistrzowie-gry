<button
  pButton
  class="square-9 cursor-pointer"
  type="button"
  severity="secondary"
  size="small"
  [text]="true"
  [rounded]="true"
  [attr.aria-label]="ariaLabel()"
  [pTooltip]="text()"
  [tooltipPosition]="position()"
  tooltipEvent="both"
  appendTo="body"
  [escape]="true"
>
  <i class="pi pi-question-circle" aria-hidden="true"></i>
</button>
