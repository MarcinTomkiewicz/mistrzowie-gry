<section class="mg-card flex-col-start-stretch gap-md w-100">
  <h2 class="mg-section__title mg-section__title--sm m-0">
    {{ sections().addons }}
  </h2>

  @if (!addonProducts().length) {
    <p class="muted-text">{{ states().emptyAddons }}</p>
  }

  <div class="flex-col-start-stretch gap-md">
    @for (addon of addonProducts(); track addon.id) {
      <button
        type="button"
        class="mg-choice-card w-100 text-left"
        [class.active]="isAddonSelected(addon)"
        (click)="toggleAddon(addon)"
      >
        <span class="flex-row-between-start flex-col-start-stretch-sm gap-sm">
          <strong>{{ addon.name }}</strong>
          <span>{{ productPriceLabel(addon, states()) }}</span>
        </span>
        @if (addon.description) {
          <span class="muted-text d-block">
            {{ addon.description }}
          </span>
        }
      </button>

      @if (isAddonSelected(addon)) {
        <div class="flex-col-start-stretch gap-md">
          @if (requiresAddonDetails(addon)) {
            <p-iftalabel class="w-100">
              <textarea
                #addonDetailsInput
                class="w-100"
                pTextarea
                [id]="'addonDetails-' + addon.slug"
                [value]="addonDetailsValue(addon)"
                [rows]="3"
                [autoResize]="true"
                (input)="setAddonCustomerDetails(addon, addonDetailsInput.value)"
              ></textarea>
              <label [for]="'addonDetails-' + addon.slug">
                {{ addon.metadata.customerDetailsLabel || labels().addonDetails }}
              </label>
            </p-iftalabel>
          }

          @if (requiresAddonQuantity(addon)) {
            <p-iftalabel class="w-100">
              <input
                #addonQuantityInput
                class="w-100"
                pInputText
                [id]="'addonQuantity-' + addon.slug"
                type="number"
                min="1"
                inputmode="numeric"
                [value]="addonQuantityValue(addon)"
                (input)="setAddonQuantity(addon, addonQuantityInput.valueAsNumber)"
              />
              <label [for]="'addonQuantity-' + addon.slug">
                {{ addon.metadata.quantityLabel || labels().addonQuantity }}
              </label>
            </p-iftalabel>
          }
        </div>
      }
    }
  </div>
</section>
