<section class="position-relative">
  <header class="mg-section__header mb-md">
    <h2 class="mg-section__title mg-section__title--md m-0">{{ i18n.program().title }}</h2>
    @if (occurrenceOptions().length) {
      <div class="flex-row-center-center flex-wrap gap-sm mt-sm" role="group" [attr.aria-label]="i18n.program().occurrenceLabel">
        <span class="small-caps muted-text">{{ i18n.program().occurrenceLabel }}</span>
        <app-occurrence-switcher
          [options]="occurrenceOptions()"
          [selectedIndex]="facade.selectedOccurrenceIndex()"
          marginBottomClass=""
          (selectedIndexChange)="facade.selectOccurrence($event)"
        />
      </div>
    }
  </header>
  @if (occurrenceOptions().length) {
    @if (cards().length) {
      <app-event-slots
        [items]="cards()"
        [slotCount]="0"
        (slotSelect)="selectSession($event)"
        (gmSelect)="facade.openGmProfile($event.id)"
      />
    } @else {
      <div class="mg-card"><p class="m-0">{{ i18n.program().inPreparation }}</p></div>
    }
  } @else {
    <div class="mg-card"><p class="m-0">{{ i18n.page().noOccurrences }}</p></div>
  }
</section>

@let selected = selectedCard();
<app-session-dialog
  [session]="selected?.sessionDetails ?? null"
  [gmDisplayName]="selected?.gmDisplayName ?? null"
  [visible]="selected !== null"
  (visibleChange)="!$event && selectedProgramItemId.set(null)"
/>

<app-loading-overlay
  [visible]="facade.profileState().kind === 'loading'"
  [label]="i18n.status().loading"
/>
<app-gm-profile-dialog
  [profile]="profile()"
  [visible]="profile() !== null"
  [showCharacterSheets]="false"
  (visibleChange)="!$event && facade.closeGmProfile()"
/>
