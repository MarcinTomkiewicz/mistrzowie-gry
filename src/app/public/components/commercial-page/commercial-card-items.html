<div class="mg-grid-2 gap-lg mt-md">
  @for (item of items(); track item.id) {
    <article class="mg-card">
      <h3 class="mg-section__title mg-section__title--sm">
        {{ item.title }}
      </h3>

      @if (item.price; as price) {
        @let pricing = formatPrice(price);

        @if (pricing.value) {
          <p class="mg-section__title mg-section__title--xs">
            {{ pricing.value }}
          </p>
        }

        @if (pricing.note) {
          <p class="mg-section__subtitle mg-section__subtitle--no-margin mg-section__subtitle--full">
            {{ pricing.note }}
          </p>
        }
      }

      @if (item.body) {
        <app-expandable-text [text]="item.body" [muted]="true" />
      }

      <app-commercial-item-details
        [capacity]="item.capacity"
        [schedule]="item.schedule"
      />
    </article>
  }
</div>
