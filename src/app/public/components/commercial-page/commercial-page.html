@if (isLoading()) {
  <section class="mg-section mg-section--full position-relative">
    <div class="mg-container">
      <app-loading-overlay [visible]="true" [label]="status().loading" />
    </div>
  </section>
} @else if (hasLoadError()) {
  <section class="mg-section">
    <div class="mg-container">
      <div class="mg-card">
        <h1 class="mg-section__title mg-section__title--sm">
          {{ errors().server }}
        </h1>
      </div>
    </div>
  </section>
} @else if (isNotFound()) {
  <section class="mg-section">
    <div class="mg-container">
      <div class="mg-card">
        <h1 class="mg-section__title mg-section__title--sm">
          {{ errors().notFound }}
        </h1>
      </div>
    </div>
  </section>
} @else if (document(); as pageDocument) {
  <app-commercial-page-renderer [document]="pageDocument" />
}
