@if (presentation(); as data) {
  @switch (data.type) {
    @case ('text') {
      <span>{{ data.value }}</span>
    }
    @case ('rich_content') {
      <app-rich-content [content]="data.value" />
    }
    @case ('price') {
      <app-commercial-price-value
        [price]="data.value"
        [locale]="locale()"
      />
    }
  }
} @else {
  <span aria-hidden="true">—</span>
}
