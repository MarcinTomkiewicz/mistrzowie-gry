@if (cardsBlock(); as cards) {
  <app-commercial-product-collection-cards
    [block]="cards"
    [products]="selectedProducts()"
    [locale]="locale()"
  />
} @else if (tableBlock(); as table) {
  <app-commercial-product-collection-table
    [block]="table"
    [products]="selectedProducts()"
    [locale]="locale()"
  />
} @else if (comparisonTableBlock(); as comparisonTable) {
  <app-commercial-product-comparison-table
    [block]="comparisonTable"
    [products]="selectedProducts()"
    [locale]="locale()"
  />
}

@if (hasPriceField() && pricingFootnote()) {
  <p class="mg-section__subtitle mg-section__subtitle--no-margin mg-section__subtitle--full mt-md">
    {{ pricingFootnote() }}
  </p>
}
