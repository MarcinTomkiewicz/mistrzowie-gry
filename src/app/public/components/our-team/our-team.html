@let data = pageVm();
@let empty = i18n.commonEmpty();
@let status = i18n.commonStatus();

<section class="mg-section">
  <div class="mg-container">
    <app-loading-overlay [visible]="isLoading()" [label]="status.loading" />

    @if (data; as vm) {
      <header class="mg-section__header">
        <h1 class="mg-section__title">{{ vm.page.title }}</h1>
        <p class="mg-section__subtitle">{{ vm.page.subtitle }}</p>
      </header>

      @if (!vm.profiles.length) {
        <div class="mg-card">
          <div class="mg-section__title mg-section__title--sm">
            {{ empty.title }}
          </div>
          <p class="mg-section__subtitle mg-section__subtitle--no-margin">
            {{ empty.description }}
          </p>
        </div>
      } @else {
        <app-gm-profiles
          [profiles]="vm.profiles"
          (profileSelected)="openProfileDialog($event)"
        />
      }
    }

    <app-gm-profile-dialog
      [visible]="isDialogVisible()"
      [profile]="selectedProfile()"
      [profiles]="profiles() ?? []"
      [enableProfileNavigation]="true"
      (visibleChange)="onDialogVisibleChange($event)"
      (profileChange)="onProfileChange($event)"
    />
  </div>
</section>
