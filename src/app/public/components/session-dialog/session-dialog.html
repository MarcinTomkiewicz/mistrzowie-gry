<p-dialog
  [visible]="visible()"
  [modal]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  appendTo="body"
  [styleClass]="'mg-dialog mg-dialog--xl'"
  (visibleChange)="visibleChange.emit($event)"
>
  @if (session(); as currentSession) {
    <app-session-details
      [session]="currentSession"
      [eventCapacity]="eventCapacity()"
      [gmDisplayName]="gmDisplayName()"
    />
  }
  <ng-template pTemplate="header">
    <div class="flex-row-start-center flex-wrap gap-xs">
      <h2 class="mg-section__title mg-section__title--md m-0">
        {{ session()?.title ?? '' }}
      </h2>

      @for (language of session()?.languages ?? []; track language.id) {
        @if (resolveLanguageFlagClass(language.flagCode); as flagClass) {
          <i
            [class]="flagClass"
            [attr.aria-label]="language.label"
            [title]="language.label"
          ></i>
        }
      }
    </div>
  </ng-template>
  <ng-template pTemplate="footer">
    <div class="flex-row-end-center">
      <p-button
        [label]="i18n.actions().close"
        severity="secondary"
        [outlined]="true"
        (onClick)="visibleChange.emit(false)"
        class="mt-md"
      />
    </div>
  </ng-template>
</p-dialog>
