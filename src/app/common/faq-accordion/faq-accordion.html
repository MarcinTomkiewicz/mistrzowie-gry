<p-accordion>
  @for (item of items(); track $index) {
    <p-accordion-panel [value]="$index">
      <p-accordion-header class="mg-section__title mg-section__title--xs">
        @if (isStructuredQuestion(item.h)) {
          <app-rich-content-inline
            [nodes]="item.h"
            (click)="stopTargetToggle($event)"
            (keydown)="stopTargetToggle($event)"
          />
        } @else {
          {{ item.h }}
        }
      </p-accordion-header>

      <p-accordion-content>
        @if (typeof item.a !== 'string') {
          <app-rich-content [content]="item.a" />
        } @else {
          <p
            class="mg-section__subtitle mg-section__subtitle--no-margin mg-section__subtitle--full"
          >
            <app-internal-link-text [text]="item.a" />
          </p>
        }
      </p-accordion-content>
    </p-accordion-panel>
  }
</p-accordion>
