<div
  #viewport
  class="pdf-viewer-dialog__viewport w-100 overflow-auto p-md touch-action-none"
  [class.cursor-grab]="canPan() && !isPanning()"
  [class.cursor-grabbing]="isPanning()"
  [class.user-select-none]="isPanning()"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerUp($event)"
>
  <div class="pdf-viewer-dialog__page position-relative mx-auto" (wheel)="onWheel($event)">
    <canvas #canvas class="d-block shadow-sm"></canvas>
    @if (surface(); as page) {
      @if (overlay(); as template) {
        <ng-container [ngTemplateOutlet]="template" [ngTemplateOutletContext]="{ $implicit: page }" />
      }
    }
  </div>
</div>
