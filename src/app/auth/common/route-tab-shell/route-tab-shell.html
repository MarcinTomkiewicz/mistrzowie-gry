<section class="mg-section mg-section--full">
  <div class="mg-container">
    <header class="mg-section__header">
      <h1 class="mg-section__title">{{ heading() }}</h1>
      @if (subtitle()) {
        <p class="mg-section__subtitle">{{ subtitle() }}</p>
      }
    </header>

    <div class="mb-lg">
      <app-route-tabs
        [tabs]="tabs()"
        (activeTabChange)="onActiveTabChange($event)"
      />
    </div>

    <ng-content />
  </div>
</section>
