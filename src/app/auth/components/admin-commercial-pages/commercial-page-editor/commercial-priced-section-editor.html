<div class="flex-col-start-stretch gap-md w-100" [formGroup]="form()">
  <app-commercial-section-base-editor
    [heading]="form().controls.heading"
    [lead]="form().controls.lead"
    [controlId]="controlId()"
  />

  <div class="flex-row-between-center flex-col-start-stretch-sm gap-sm">
    <h4 class="mg-section__title mg-section__title--xs m-0">
      {{ i18n.items().title }}
    </h4>

    <p-button
      type="button"
      severity="secondary"
      [label]="i18n.items().addItem"
      icon="pi pi-plus"
      (onClick)="addItem()"
    />
  </div>

  @if (!form().controls.items.length) {
    <small class="error-text">{{ i18n.items().empty }}</small>
  }

  @for (
    item of form().controls.items.controls;
    track item;
    let index = $index
  ) {
    <section class="mg-card flex-col-start-stretch gap-md w-100">
      <div class="flex-row-between-center flex-col-start-stretch-sm gap-sm">
        <span class="tag-badge tag-badge--muted">{{ index + 1 }}</span>

        <app-commercial-item-editor-actions
          [index]="index"
          [itemCount]="form().controls.items.length"
          (moveUp)="moveItem(index, -1)"
          (moveDown)="moveItem(index, 1)"
          (remove)="removeItem(index)"
        />
      </div>

      <app-commercial-priced-item-editor
        [form]="item"
        [priceRequired]="priceRequired()"
        [controlId]="controlId() + '-item-' + index"
      />
    </section>
  }
</div>
