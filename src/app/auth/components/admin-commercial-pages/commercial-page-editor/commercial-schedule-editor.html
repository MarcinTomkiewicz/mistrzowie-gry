<section
  class="flex-col-start-stretch gap-md w-100"
  [formGroup]="form()"
>
  <h4 class="mg-section__title mg-section__title--xs m-0">
    {{ i18n.schedule().sectionTitle }}
  </h4>

  <div class="mg-grid-2 gap-md w-100">
    <p-iftalabel class="w-100">
      <p-select
        class="w-100"
        [inputId]="controlId() + '-duration-mode'"
        formControlName="durationMode"
        [options]="durationModeOptions()"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        (onChange)="syncDurationMode()"
      />
      <label [for]="controlId() + '-duration-mode'">
        {{ i18n.schedule().durationMode }}
      </label>
    </p-iftalabel>

    @if (form().controls.durationMode.value === 'custom') {
      <p-iftalabel class="w-100">
        <p-inputnumber
          class="w-100"
          [inputId]="controlId() + '-duration-minutes'"
          formControlName="durationMinutes"
          [min]="1"
          [maxFractionDigits]="0"
          [useGrouping]="false"
        />
        <label [for]="controlId() + '-duration-minutes'">
          {{ i18n.schedule().durationMinutes }}
        </label>
      </p-iftalabel>
    }

    <p-iftalabel class="w-100">
      <p-inputnumber
        class="w-100"
        [inputId]="controlId() + '-session-count'"
        formControlName="sessionCount"
        [min]="1"
        [maxFractionDigits]="0"
        [useGrouping]="false"
      />
      <label [for]="controlId() + '-session-count'">
        {{ i18n.schedule().sessionCount }}
      </label>
    </p-iftalabel>

    <p-iftalabel class="w-100">
      <p-inputnumber
        class="w-100"
        [inputId]="controlId() + '-sessions-per-month'"
        formControlName="sessionsPerMonth"
        [min]="1"
        [maxFractionDigits]="0"
        [useGrouping]="false"
      />
      <label [for]="controlId() + '-sessions-per-month'">
        {{ i18n.schedule().sessionsPerMonth }}
      </label>
    </p-iftalabel>

    <p-iftalabel class="w-100">
      <p-inputnumber
        class="w-100"
        [inputId]="controlId() + '-meeting-count-min'"
        formControlName="meetingCountMin"
        [min]="1"
        [maxFractionDigits]="0"
        [useGrouping]="false"
      />
      <label [for]="controlId() + '-meeting-count-min'">
        {{ i18n.schedule().meetingCountMin }}
      </label>
    </p-iftalabel>

    <p-iftalabel class="w-100">
      <p-inputnumber
        class="w-100"
        [inputId]="controlId() + '-meeting-count-max'"
        formControlName="meetingCountMax"
        [min]="1"
        [maxFractionDigits]="0"
        [useGrouping]="false"
      />
      <label [for]="controlId() + '-meeting-count-max'">
        {{ i18n.schedule().meetingCountMax }}
      </label>
    </p-iftalabel>
  </div>

  @if (form().touched && form().invalid) {
    <small class="error-text">{{ i18n.validation().invalidSchedule }}</small>
  }
</section>
