<section class="flex-col-start-stretch gap-md w-100">
  <div class="flex-row-between-center flex-col-start-stretch-sm gap-sm">
    <h2 class="mg-section__title mg-section__title--md m-0">
      {{ i18n.products().sectionTitle }}
    </h2>

    <p-button
      type="button"
      severity="secondary"
      [label]="i18n.commonActions().addItem"
      icon="pi pi-plus"
      (onClick)="addProduct()"
    />
  </div>

  @if (!products().length) {
    <p class="m-0">{{ i18n.products().empty }}</p>
  }
  <app-commercial-publication-issue-messages
    [issues]="diagnostics().issuesAt({ field: 'products' })"
  />

  @for (group of productGroups(); track group.kind) {
    @if (group.items.length) {
      <section class="flex-col-start-stretch gap-sm w-100">
        <h3 class="mg-section__title mg-section__title--sm m-0">
          {{ group.label }}
        </h3>

        @for (item of group.items; track item.form) {
          <article
            class="mg-card flex-col-start-stretch gap-sm p-md w-100"
            [class.border-danger]="diagnostics().issuesWithin({ productId: item.form.controls.id.value }).length"
          >
            <div class="flex-row-between-start flex-col-start-stretch-sm gap-sm">
              <app-commercial-product-summary
                [product]="item.form"
                [products]="products()"
                [constants]="constants()"
                [locale]="locale()"
              />

              <div class="flex-row-end-center flex-wrap gap-xs">
                <p-button
                  type="button"
                  severity="secondary"
                  size="small"
                  [outlined]="true"
                  [label]="i18n.commonActions().edit"
                  icon="pi pi-pencil"
                  (onClick)="editProduct(item.index)"
                />
                <p-button
                  type="button"
                  severity="danger"
                  size="small"
                  [text]="true"
                  [label]="i18n.commonActions().delete"
                  icon="pi pi-trash"
                  (onClick)="removeProduct(item.index)"
                />
              </div>
            </div>
          </article>
        }
      </section>
    }
  }
</section>

<p-dialog
  styleClass="mg-dialog mg-dialog--lg"
  [modal]="true"
  [visible]="editorForm() !== null"
  [header]="i18n.products().product"
  [draggable]="false"
  (visibleChange)="onDialogVisibleChange($event)"
>
  @if (editorForm(); as productForm) {
    <div class="flex-col-start-stretch gap-md w-100">
      <app-commercial-product-editor
        [form]="productForm"
        controlId="commercial-product-dialog"
        [tokens]="tokens()"
        [addonOptions]="addonOptions()"
        [diagnostics]="diagnostics()"
      />

      <div class="p-dialog-footer flex-row-end-center gap-sm w-100 p-md">
        <p-button
          type="button"
          severity="secondary"
          [outlined]="true"
          [label]="i18n.commonActions().cancel"
          icon="pi pi-times"
          (onClick)="closeEditor()"
        />
        <p-button
          type="button"
          severity="success"
          [label]="i18n.products().saveProduct"
          icon="pi pi-save"
          (onClick)="saveProduct()"
        />
      </div>
    </div>
  }
</p-dialog>
