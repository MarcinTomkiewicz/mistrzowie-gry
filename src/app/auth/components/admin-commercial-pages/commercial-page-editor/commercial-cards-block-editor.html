<div class="flex-col-start-stretch gap-md w-100" [formGroup]="form()">
  <div class="mg-grid-2 gap-md w-100" [formGroup]="form().controls.presentation">
    <p-iftalabel class="w-100">
      <p-select class="w-100" [inputId]="controlId() + '-orientation'" formControlName="orientation" [options]="orientationOptions()" optionLabel="label" optionValue="value" appendTo="body" />
      <label [for]="controlId() + '-orientation'">{{ i18n.cards().cardOrientation }}</label>
    </p-iftalabel>
    <p-iftalabel class="w-100">
      <p-select class="w-100" [inputId]="controlId() + '-columns'" formControlName="columns" [options]="columnOptions" optionLabel="label" optionValue="value" appendTo="body" />
      <label [for]="controlId() + '-columns'">{{ i18n.cards().columnCount }}</label>
    </p-iftalabel>
  </div>
  <div class="flex-row-end-center">
    <p-button type="button" severity="secondary" [label]="i18n.cards().add" icon="pi pi-plus" (onClick)="addCard()" />
  </div>
  @if (!form().controls.items.length) { <p class="m-0 error-text">{{ i18n.cards().empty }}</p> }

  @for (card of form().controls.items.controls; track card; let index = $index) {
    <div class="mg-card flex-col-start-stretch gap-md p-sm w-100" [formGroup]="card">
      <app-item-editor-actions [index]="index" [itemCount]="form().controls.items.length" (moveUp)="moveCard(index, -1)" (moveDown)="moveCard(index, 1)" (remove)="removeCard(index)" />
      <div class="flex-col-start-stretch gap-xs w-100">
        <p-iftalabel class="w-100">
          <input pInputText class="w-100" [id]="controlId() + '-' + index + '-title'" formControlName="title" autocomplete="off" />
          <label [for]="controlId() + '-' + index + '-title'">{{ i18n.cards().title }}</label>
        </p-iftalabel>
        @if (card.controls.title.touched && card.controls.title.invalid) {
          <small class="error-text">{{ i18n.commonForm().required }}</small>
        }
      </div>
      <app-rich-content-editor [control]="card.controls.body" [controlId]="controlId() + '-' + index + '-body'" [label]="i18n.cards().body" [tokens]="tokens()" />
      <div class="flex-row-start-center gap-xs">
        <p-checkbox [inputId]="controlId() + '-' + index + '-price-enabled'" formControlName="hasPrice" [binary]="true" (onChange)="syncPrice(index)" />
        <label [for]="controlId() + '-' + index + '-price-enabled'">{{ i18n.cards().hasPrice }}</label>
      </div>
      @if (card.controls.hasPrice.value) {
        <app-price-editor [form]="card.controls.price" [controlId]="controlId() + '-' + index + '-price'" />
      }
    </div>
  }
</div>
