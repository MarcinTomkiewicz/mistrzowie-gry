<section id="global-event-base-time-blocks-editor" tabindex="-1" class="mg-card mg-form flex-col-start-stretch gap-sm px-md py-sm w-100 min-w-0">
  <header class="flex-row-start-center gap-sm">
    <h2 class="mg-section__title mg-section__title--md m-0">{{ copy().title }}</h2>
    <app-context-help [text]="copy().hint" [ariaLabel]="copy().title + ': ' + i18n.creation().help" />
  </header>
  @if (!editor.canEdit()) { <p-message severity="warn" role="status">{{ copy().protected }}</p-message> }
  @if (errorMessage(); as message) { <p-message severity="warn" role="alert">{{ message }}</p-message> }
  <app-event-global-time-blocks [blocks]="editor.form.controls.timeBlocks" idPrefix="base-time-blocks"
    [savedBase]="true" [validationAttempted]="editor.validationAttempted()" />
  @if (editor.preview(); as preview) {
    @if (preview.status === 'invalid') { <p-message severity="error" role="alert">{{ copy().invalid }}</p-message> }
    @if (preview.status === 'blocked') { <p-message severity="warn" role="alert">{{ copy().blocked }}</p-message> }
  }
</section>
