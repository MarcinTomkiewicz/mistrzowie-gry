<dl class="flex-col-start-stretch gap-sm m-0 w-100">
  @for (row of rows(); track row.label) {
    <div class="flex-row-between-start flex-col-start-stretch-sm gap-sm border-bottom pb-sm min-w-0">
      <dt class="muted-text flex-1 min-w-0 text-wrap-anywhere">{{ row.label }}</dt>
      <dd class="m-0 text-right text-left-sm text-wrap-anywhere">
        @if (row.previewUrl) {
          <a [href]="row.previewUrl" target="_blank" rel="noopener noreferrer">{{ row.value }}</a>
        } @else {
          {{ row.value }}
        }
      </dd>
    </div>
  }
</dl>
