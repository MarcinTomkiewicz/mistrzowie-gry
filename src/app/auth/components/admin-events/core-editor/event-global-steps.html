<p-stepper class="d-block w-100 min-w-0" [value]="activeStep()" [linear]="false" (valueChange)="selectStep($event)">
  <p-step-list class="mg-grid grid-6-cols grid-2-cols-md grid-1-cols-sm gap-xs border-bottom pb-sm w-100">
    @for (step of steps(); track step.value) {
      <p-step class="min-w-0" [value]="step.value" [disabled]="disabled() || step.value > reachedStep()">
        <span class="text-wrap-anywhere">{{ step.label }}</span>
      </p-step>
    }
  </p-step-list>
  <p-step-panels>
    @for (step of steps(); track step.value) {
      <p-step-panel [value]="step.value">
        <ng-template #content>
          @if (activeStep() === step.value) {
            <ng-container [ngTemplateOutlet]="stepContent()" />
          }
        </ng-template>
      </p-step-panel>
    }
  </p-step-panels>
</p-stepper>
