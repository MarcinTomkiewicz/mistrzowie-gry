<section id="global-event-schedule-editor" tabindex="-1" class="mg-form flex-col-start-stretch gap-sm w-100 min-w-0">
  <app-event-schedule-editor [form]="editor.form" [globalCalendar]="true" [validationAttempted]="editor.validationAttempted()" />
  @if (errorMessage(); as message) { <p-message severity="warn" role="alert">{{ message }}</p-message> }
  @if (editor.preview(); as preview) {
    @for (error of preview.fieldErrors; track $index) {
      <p-message severity="error" role="alert">{{ copy().invalid }} {{ error.detail }}</p-message>
    }
    @for (blocker of preview.blockers; track $index) {
      <p-message severity="error" role="alert">{{ copy().blocked }} - {{ blocker.code }}</p-message>
    }
  }
</section>
