<p-autocomplete
  class="w-100"
  [formControl]="selectionControl"
  [inputId]="inputId()"
  [suggestions]="suggestions()"
  [placeholder]="placeholder()"
  [autocomplete]="autocomplete()"
  [forceSelection]="true"
  [dropdown]="true"
  [showClear]="true"
  [delay]="0"
  [invalid]="isInvalid()"
  optionLabel="label"
  dropdownMode="blank"
  appendTo="body"
  (completeMethod)="onComplete($event)"
  (onSelect)="onSelect($event)"
  (onClear)="onClear()"
  (onBlur)="onBlur()"
/>
