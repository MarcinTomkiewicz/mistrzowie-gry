<section class="flex-col-start-stretch gap-sm border-top pt-sm w-100">
  <header class="flex-row-between-start flex-wrap gap-sm w-100">
    <div class="flex-col-start-stretch gap-xs min-w-0">
      <h5 class="mg-section__title mg-section__title--xs m-0">
        {{ i18n.labels().sourceDocument }}
      </h5>
      <strong class="text-wrap-anywhere">{{ title() }}</strong>
    </div>

    <div class="tag-badges">
      <span class="tag-badge tag-badge--info">
        {{ i18n.statuses().origins[document().origin] }}
      </span>
      <span [class]="'tag-badge ' + STATUS_BADGE_CLASS[document().status]">
        {{ i18n.statuses().documents[document().status] }}
      </span>
    </div>
  </header>

  <app-document-version-summary
    [version]="document().currentVersion"
    [historyCount]="document().historyCount"
    [downloadingVersionId]="downloadingVersionId()"
    [disabled]="disabled()"
    (downloadRequested)="downloadRequested.emit($event)"
  />
</section>
