<article class="mg-card flex-col-start-stretch gap-sm w-100">
  <header class="flex-row-between-start flex-wrap gap-sm w-100">
    <h4 class="mg-section__title mg-section__title--xs m-0 text-wrap-anywhere">
      {{ title() }}
    </h4>
    <span [class]="'tag-badge ' + STATUS_BADGE_CLASS[document().status]">
      {{ i18n.statuses().documents[document().status] }}
    </span>
  </header>

  <app-document-version-list
    [versions]="versions()"
    [currentVersionId]="document().currentVersion?.id ?? null"
    [downloadingVersionId]="downloadingVersionId()"
    [disabled]="mutationsBlocked()"
    (downloadRequested)="downloadRequested.emit($event)"
  />

  <div class="flex-row-end-center flex-wrap gap-sm w-100">
    @if (capability().canSubmit) {
      <p-button
        type="button"
        icon="pi pi-send"
        [label]="i18n.actions().submitDocument"
        [loading]="activeMutationId() === document().id"
        [disabled]="mutationsBlocked()"
        (onClick)="confirmSubmit($event)"
      />
    }
    @if (capability().canWithdraw) {
      <p-button
        type="button"
        severity="danger"
        icon="pi pi-undo"
        [label]="i18n.actions().withdrawDocument"
        [loading]="activeMutationId() === document().id"
        [disabled]="mutationsBlocked()"
        (onClick)="confirmWithdraw($event)"
      />
    }
  </div>

  @if (capability().canAddVersion && definition(); as definition) {
    <app-document-upload
      [definition]="definition"
      [document]="submissionDocument()"
      [disabled]="mutationsBlocked()"
      (completed)="uploadCompleted.emit()"
      (busyChange)="uploadBusyChange.emit($event)"
      (blockingError)="blockingError.emit($event)"
      (reloadRequired)="reloadRequired.emit()"
    />
  }
</article>
