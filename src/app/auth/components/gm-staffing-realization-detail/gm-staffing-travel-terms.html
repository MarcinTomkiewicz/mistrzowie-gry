<div class="flex-col-start-stretch gap-md w-100">
  @for (group of groups(); track group.key) {
    <section class="flex-col-start-stretch gap-sm w-100">
      <h3 class="mg-section__title mg-section__title--sm m-0">
        {{ i18n.sections()[group.key] }}
      </h3>
      <dl class="mg-grid grid-2-cols grid-1-cols-sm gap-md m-0">
        @for (row of group.rows; track row.key) {
          <div class="flex-col-start-stretch gap-xs min-w-0">
            <dt class="muted-text">{{ i18n.fields()[row.key] }}</dt>
            <dd class="m-0 text-pre-line">
              {{ row.value ?? i18n.commonValues().notProvided }}
            </dd>
          </div>
        }
      </dl>
    </section>
  }
</div>
