<app-route-tab-shell
  [heading]="facade.detail()?.name ?? i18n.copy().title"
  [seoTitle]="facade.detail()?.name ?? i18n.copy().title"
  [canonicalUrl]="pageUrl()"
  [tabs]="tabs()"
>
  <div class="position-relative flex-col-start-stretch gap-md w-100 min-w-0"
    [attr.aria-busy]="facade.isLoading() || facade.isMutating()">
    <div>
      <p-button type="button" severity="secondary" [outlined]="true" icon="pi pi-arrow-left"
        [label]="i18n.commonCta().goBack" [routerLink]="hubRoute" />
    </div>
    <app-loading-overlay [visible]="facade.isLoading() || facade.isMutating()"
      [label]="facade.isMutating() ? i18n.commonStatus().saving : i18n.commonStatus().loading" />
    @if (facade.loadError() && !facade.isLoading()) {
      <section class="mg-card flex-col-start-stretch gap-sm p-md w-100" role="alert">
        <h2 class="mg-section__title mg-section__title--sm m-0">
          {{ isNotFound() ? i18n.copy().errors.notFound : i18n.copy().errors.loadFailed }}
        </h2>
        @if (!isNotFound()) {
          <p class="m-0">{{ i18n.commonErrors().generic }}</p>
          <p-button severity="secondary" icon="pi pi-refresh" [label]="i18n.commonActions().retry" (onClick)="retry()" />
        }
      </section>
    } @else if (facade.detail()) {
      <router-outlet />
    }
  </div>
</app-route-tab-shell>
