<section class="mg-card flex-col-start-stretch gap-md p-md w-100">
  <div class="flex-col-start-stretch gap-xs">
    <div class="flex-row-start-center gap-xs">
      <h2 class="mg-section__title mg-section__title--md m-0">
        {{ i18n.review().sections.decision }}
      </h2>
      <app-context-help
        [text]="i18n.review().tooltips.decision"
        [ariaLabel]="i18n.contextHelpLabel(i18n.review().sections.decision)"
      />
    </div>
    <p class="m-0">{{ i18n.review().tooltips.decision }}</p>
  </div>

  <form class="flex-col-start-stretch gap-md w-100" [formGroup]="form">
    <div class="flex-row-start-start gap-xs w-100">
      <p-iftalabel class="flex-1">
        <textarea
          pTextarea
          class="w-100"
          id="admin-review-note"
          formControlName="note"
          rows="3"
          [maxlength]="limits.noteLength"
        ></textarea>
        <label for="admin-review-note">{{ i18n.review().fields.note }}</label>
      </p-iftalabel>
      <app-context-help
        [text]="i18n.review().tooltips.decisionNote"
        [ariaLabel]="i18n.contextHelpLabel(i18n.review().fields.note)"
      />
    </div>

    <div class="flex-row-start-start gap-xs w-100">
      <div class="flex-col-start-stretch gap-xs flex-1">
        <p-iftalabel class="w-100">
          <textarea
            pTextarea
            class="w-100"
            id="admin-review-rejection-reason"
            formControlName="rejectionReason"
            rows="4"
            [maxlength]="limits.rejectionReasonLength"
          ></textarea>
          <label for="admin-review-rejection-reason">
            {{ i18n.review().fields.rejectionReason }}
          </label>
        </p-iftalabel>
        @if (
          form.controls.rejectionReason.touched &&
          form.controls.rejectionReason.invalid
        ) {
          <small class="error-text">{{ i18n.commonForm().required }}</small>
        }
      </div>
      <app-context-help
        [text]="i18n.review().tooltips.rejectionReason"
        [ariaLabel]="i18n.contextHelpLabel(i18n.review().fields.rejectionReason)"
      />
    </div>

    <div class="flex-row-end-center flex-wrap gap-md w-100">
      <div class="flex-row-start-center gap-xs">
        <p-button
          type="button"
          severity="danger"
          icon="pi pi-times-circle"
          [label]="i18n.review().actions.rejectDocument"
          [loading]="rejectBusy()"
          [disabled]="disabled() || acceptBusy() || rejectBusy()"
          (onClick)="confirmReject($event)"
        />
        <app-context-help
          [text]="i18n.review().tooltips.rejectDocument"
          [ariaLabel]="i18n.contextHelpLabel(i18n.review().actions.rejectDocument)"
        />
      </div>

      <div class="flex-row-start-center gap-xs">
        <p-button
          type="button"
          severity="success"
          icon="pi pi-check"
          [label]="i18n.review().actions.acceptDocument"
          [loading]="acceptBusy()"
          [disabled]="disabled() || acceptBusy() || rejectBusy()"
          (onClick)="confirmAccept($event)"
        />
        <app-context-help
          [text]="i18n.review().tooltips.acceptDocument"
          [ariaLabel]="i18n.contextHelpLabel(i18n.review().actions.acceptDocument)"
        />
      </div>
    </div>
  </form>
</section>
