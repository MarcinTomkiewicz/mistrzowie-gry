@let copy = i18n();
@let res = resources();

<div class="flex-col-start-stretch gap-md w-100">
  <p-confirmdialog
    key="event-signup-withdraw"
    styleClass="mg-dialog mg-dialog--sm mg-confirmdialog"
  />

  @if (showSubmittedSessionSummary()) {
    <div class="mg-card flex-col-start-stretch gap-md">
      <header class="mg-section__header w-100">
        <h2 class="mg-section__title mg-section__title--md">
          {{ copy.sections().submittedSessionTitle }}
        </h2>
      </header>

      <app-session-list
        [sessions]="submittedSessions()"
        [labels]="sessionListLabels()"
        [emptyTitle]="copy.template().emptyTitle"
        [emptyDescription]="copy.template().emptyDescription"
        [actions]="submittedSessionActions()"
        [busy]="isBusy()"
        [resolveDifficultyLabel]="resolveDifficultyLabelFn"
        [playersLabel]="copy.playersLabel"
        [minAgeLabel]="copy.minAgeLabel"
        (edit)="onEditSubmittedCustomSession()"
        (action)="onWithdrawCurrentSession($event)"
      />
    </div>
  } @else {
    <div class="mg-card flex-col-start-stretch gap-md">
      <div class="hide-down-sm">
        <p-tabs [value]="mode()">
          <p-tablist>
            <p-tab value="template" (click)="setMode('template')">
              {{ copy.mode().templateLabel }}
            </p-tab>
            <p-tab value="custom" (click)="setMode('custom')">
              {{ copy.mode().customLabel }}
            </p-tab>
          </p-tablist>
        </p-tabs>
      </div>

      <div class="show-down-sm w-100" [formGroup]="form">
        <p-iftalabel class="w-100">
          <p-select
            class="w-100"
            [options]="modeOptions()"
            optionLabel="label"
            optionValue="value"
            formControlName="mode"
            appendTo="body"
          />
          <label>{{ copy.form().modeLabel }}</label>
        </p-iftalabel>
      </div>
    </div>

    @if (isTemplateMode()) {
      <div class="mg-card flex-col-start-stretch gap-md">
        <app-session-list
          [sessions]="templateSessions()"
          [labels]="sessionListLabels()"
          [emptyTitle]="copy.template().emptyTitle"
          [emptyDescription]="copy.template().emptyDescription"
          [busy]="isBusy()"
          [selectable]="true"
          [selectedSessionId]="selectedTemplateId()"
          [selectLabel]="copy.actions().selectLabel"
          [resolveDifficultyLabel]="resolveDifficultyLabelFn"
          [playersLabel]="copy.playersLabel"
          [minAgeLabel]="copy.minAgeLabel"
          (select)="onTemplateSelect($event)"
        />

        <div class="flex-row-center-center gap-sm">
          <p-button
            [label]="copy.actions().submitLabel"
            severity="success"
            [disabled]="!canSubmitTemplate() || isBusy()"
            [loading]="isSubmitting()"
            loadingIcon="pi pi-d20"
            (onClick)="onSubmitTemplate()"
          />
        </div>
      </div>
    }

    @if (isCustomMode()) {
      <div class="mg-card flex-col-center-stretch gap-md">
        <div class="w-100 flex-col-center-center" [formGroup]="form">
          @if (customSessionOptions().length) {
            <div class="w-80 w-100-sm">
              <p-iftalabel class="w-100">
                <p-select
                  #customSessionSelect
                  class="w-100"
                  [options]="customSessionOptions()"
                  optionLabel="label"
                  optionValue="value"
                  formControlName="customSessionId"
                  appendTo="body"
                  (onChange)="onCustomSessionOptionChange(customSessionSelect)"
                />
                <label>{{ copy.custom().previousSessionsLabel }}</label>
              </p-iftalabel>
            </div>
          }
        </div>

        <app-session-form
          [initial]="customSessionFormInitial()"
          [systems]="res.systems"
          [styles]="res.styles"
          [triggers]="res.triggers"
          [languages]="res.languages"
          [submitLabel]="copy.actions().submitLabel"
          [cancelLabel]="copy.commonActions().clear"
          [busy]="isBusy()"
          (save)="onSubmitCustom($event)"
          (cancel)="onResetCustomSession()"
        />
      </div>
    }
  }
</div>
