name: Deploy Mistrzowie Gry

on:
  push:
    branches:
      - master

concurrency:
  group: mistrzowie-gry-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      APP_BASE_HREF: /
      DEPLOY_ARCHIVE: /tmp/mistrzowie-gry-dist-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.tgz
      DEPLOY_SCRIPT: /tmp/mistrzowie-gry-deploy-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.sh
      ORIGIN_SMOKE_SCRIPT: /tmp/mistrzowie-gry-origin-smoke-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.sh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (SSR)
        run: npm run build:ssr

      - name: Write deployment metadata
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_RUN_NUMBER: ${{ github.run_number }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node -e "const fs = require('node:fs'); const metadata = { sha: process.env.DEPLOY_SHA, runNumber: Number(process.env.DEPLOY_RUN_NUMBER), runId: process.env.DEPLOY_RUN_ID, runAttempt: Number(process.env.DEPLOY_RUN_ATTEMPT), builtAt: new Date().toISOString() }; fs.writeFileSync('dist/mistrzowie-gry/deployment-metadata.json', JSON.stringify(metadata, null, 2) + '\n');"

      - name: Validate deployment artifact
        run: |
          test -f dist/mistrzowie-gry/browser/index.html
          test -f dist/mistrzowie-gry/server/server.mjs
          test -f dist/mistrzowie-gry/deployment-metadata.json

      - name: Pack dist
        run: |
          tar -czf "$DEPLOY_ARCHIVE" \
            -C dist/mistrzowie-gry \
            browser \
            server \
            deployment-metadata.json

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload dist archive
        run: |
          scp -P "${{ secrets.SSH_PORT }}" \
            "$DEPLOY_ARCHIVE" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$DEPLOY_ARCHIVE"

      - name: Upload deploy script
        run: |
          scp -P "${{ secrets.SSH_PORT }}" \
            scripts/deploy_dist.sh \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$DEPLOY_SCRIPT"
          scp -P "${{ secrets.SSH_PORT }}" \
            scripts/origin_smoke.sh \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$ORIGIN_SMOKE_SCRIPT"

      - name: Run remote deploy
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "chmod +x '$DEPLOY_SCRIPT' '$ORIGIN_SMOKE_SCRIPT' && '$DEPLOY_SCRIPT' '$DEPLOY_ARCHIVE' '$GITHUB_SHA' '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT' '$ORIGIN_SMOKE_SCRIPT'"
